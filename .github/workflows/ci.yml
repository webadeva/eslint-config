name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # commitlint needs the PR's commit range, not a shallow clone.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Type-check, lint, build, test
        run: pnpm check

      - name: Format check
        run: pnpm format:check

  # The dev tooling needs Node 22+, but the package supports Node >=20.19:
  # build on Node 24, then load and run the built presets on older versions.
  node-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.19", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node 24 (build)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup Node ${{ matrix.node-version }} (runtime)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Smoke test the built presets
        run: node .github/scripts/smoke-test.mjs
