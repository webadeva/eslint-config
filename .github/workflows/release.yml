name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Self-test the version bump script
        run: node .github/scripts/next-version.mjs --self-test

      - name: Type-check, lint, build, test
        run: pnpm check

      - name: Format check
        run: pnpm format:check

  publish:
    needs: test
    if: "github.event.head_commit != null && !startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # trusted publishing (OIDC) needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute next version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          CUR=$(node -p "require('./package.json').version")
          NEW=$(node .github/scripts/next-version.mjs "$CUR" "$COMMIT_MSG")
          echo "NEW=$NEW" >> "$GITHUB_ENV"

      - name: Bump package version
        run: |
          set -euo pipefail
          npm pkg set version="$NEW"
          pnpm exec prettier --write package.json

      # Trusted publishing adds provenance automatically. prepublishOnly runs
      # `pnpm check`, so the published build is tested at the new version.
      - name: Publish
        run: |
          set -euo pipefail
          if npm view "@webadeva/eslint-config@$NEW" version >/dev/null 2>&1; then
            echo "@webadeva/eslint-config@$NEW already published, skipping"
          else
            npm publish --access public
          fi

      - name: Commit and tag
        env:
          # Skip the local git hooks: the pre-push hook refuses pushes to main.
          HUSKY: 0
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$NEW [skip ci]"
          git pull --rebase --autostash origin main
          git tag "v$NEW"
          git push origin main
          git push origin "v$NEW"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$NEW" --generate-notes
